<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body{margin:0;width:280px;padding:16px;font:14px/1.45 'Segoe UI',system-ui,sans-serif;color:#14161c;background:#fff}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
  .brand svg{width:22px;height:22px;color:#6d28d9}
  p{margin:8px 0 12px;color:#5d6272}
  button{display:block;width:100%;padding:10px 12px;border-radius:10px;border:0;background:#6d28d9;color:#fff;font:600 14px inherit;cursor:pointer}
  button.secondary{margin-top:8px;background:#fff;color:#14161c;border:1px solid #e3e6ee}
  .auto{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px}
</style>
</head>
<body>
  <div class="brand"><svg viewBox="0 0 64 64" fill="none"><path d="M4 32C12 18 22 12 32 12s20 6 28 20c-8 14-18 20-28 20S12 46 4 32Z" stroke="currentColor" stroke-width="5"/><circle cx="32" cy="32" r="10" fill="currentColor"/></svg>Argus Lens</div>
  <p>Check a photo or video from your computer for signs of AI and private details.</p>
  <button id="file" type="button">Check a file</button>
  <button id="settings" class="secondary" type="button">Settings</button>
  <label class="auto"><input id="auto" type="checkbox"> Check images automatically as I scroll</label>
<script src="popup.js"></script>
</body>
</html>
